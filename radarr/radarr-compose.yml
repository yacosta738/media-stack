services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4.10291-ls288
    container_name: radarr
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    environment:
      PUID: ${PUID:?PUID must be set}
      PGID: ${PGID:?PGID must be set}
      TZ: ${TZ:?TZ must be set}
    volumes:
      - ${CONFIG_ROOT:?CONFIG_ROOT must be set}/radarr/config:/config
      - ${DATA_ROOT:?DATA_ROOT must be set}:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-frontend}
      - traefik.http.routers.radarr.entrypoints=web,websecure
      - traefik.http.routers.radarr.rule=Host(`radarr.${MEDIA_DOMAIN:?MEDIA_DOMAIN must be set}`)
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    restart: unless-stopped
