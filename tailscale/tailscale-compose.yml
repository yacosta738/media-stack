services:
  tailscale:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: tailscale
    hostname: ${TAILSCALE_HOSTNAME:-media-stack}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in .env or the shell}
      TS_STATE_DIR: /var/lib/tailscale
      TS_ACCEPT_DNS: ${TS_ACCEPT_DNS:-true}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:?TS_EXTRA_ARGS must define the approved exit node}
      TS_USERSPACE: ${TS_USERSPACE:-false}
      TZ: ${TZ:?TZ must be set}
    volumes:
      - ${TS_STATE_DIR:?TS_STATE_DIR must be set}:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - label=disable
    restart: unless-stopped
    networks:
      - frontend
      - backend

networks:
  frontend:
    name: ${TRAEFIK_NETWORK:-frontend}
    external: true
  backend:
    name: ${TAILSCALE_NETWORK:-backend}
    external: true
