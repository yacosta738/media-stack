services:
  traefik:
    image: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?CF_DNS_API_TOKEN must be set}
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL must be set}
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG_ROOT:-./config}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_CONFIG_ROOT:-./config}/conf:/etc/traefik/conf:ro
      - ${TRAEFIK_CONFIG_ROOT:-./config}/certs:/etc/traefik/certs
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    labels:
      - traefik.enable=false

networks:
  frontend:
    name: ${TRAEFIK_NETWORK:-frontend}
    external: true
  backend:
    name: ${TAILSCALE_NETWORK:-backend}
    external: true
